services:
  - type: web
    name: capohornlab-website
    env: python
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://www.capohornlab.com,https://capohornlab.com
      - key: FRONTEND_URL
        value: https://www.capohornlab.com
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        value: farne022@gmail.com,capo.horn.lab@gmail.com
      - key: RESEND_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    plan: free

  - type: pserv
    name: capohornlab-db
    env: docker
    region: frankfurt
    plan: free
    disk:
      name: data
      mountPath: /var/lib/postgresql/data
      sizeGB: 1
    ipAllowList: []